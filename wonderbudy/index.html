<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Media Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d14;
    --surface: #16162a;
    --surface2: #1e1e38;
    --border: #2e2e52;
    --accent: #f0c060;
    --accent2: #7c6bff;
    --accent3: #ff6b9d;
    --text: #e8e4f0;
    --muted: #7a7899;
    --music: #60e0c0;
    --story: #ff9f7a;
    --special: #c07aff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 20% 10%, rgba(124,107,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 30% at 80% 80%, rgba(240,192,96,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 56px 0 32px;
    text-align: center;
  }

  .header-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(240,192,96,0.3);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, var(--accent) 0%, #fff 50%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
  }

  /* Stats bar */
  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin: 28px 0 40px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat-num.music { color: var(--music); }
  .stat-num.story { color: var(--story); }
  .stat-num.special { color: var(--special); }
  .stat-num.total { color: var(--accent); }

  .stat-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Controls */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  input[type="search"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px 11px 42px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="search"]:focus {
    border-color: var(--accent2);
  }

  input[type="search"]::placeholder { color: var(--muted); }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--accent2); color: var(--text); }
  .filter-btn.active-all { background: rgba(240,192,96,0.15); border-color: var(--accent); color: var(--accent); }
  .filter-btn.active-music { background: rgba(96,224,192,0.1); border-color: var(--music); color: var(--music); }
  .filter-btn.active-story { background: rgba(255,159,122,0.1); border-color: var(--story); color: var(--story); }
  .filter-btn.active-special { background: rgba(192,122,255,0.1); border-color: var(--special); color: var(--special); }

  /* Folder select */
  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    min-width: 130px;
  }

  select:focus { border-color: var(--accent2); }

  /* Results info */
  .results-info {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .results-info span { color: var(--accent); font-weight: 500; }

  /* File grid */
  .file-list {
    display: grid;
    gap: 6px;
  }

  .file-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    transition: all 0.15s;
    cursor: default;
  }

  .file-item:hover {
    background: var(--surface2);
    border-color: var(--accent2);
    transform: translateX(2px);
  }

  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    justify-self: center;
  }

  .cat-dot.Music { background: var(--music); box-shadow: 0 0 6px var(--music); }
  .cat-dot.Story { background: var(--story); box-shadow: 0 0 6px var(--story); }
  .cat-dot.Special { background: var(--special); box-shadow: 0 0 6px var(--special); }

  .file-name {
    font-size: 14px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .file-name mark {
    background: rgba(240,192,96,0.25);
    color: var(--accent);
    border-radius: 3px;
    padding: 0 2px;
  }

  .file-folder {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .folder-MUSIC_1, .folder-MUSIC_2, .folder-MUSIC_3 {
    background: rgba(96,224,192,0.1);
    color: var(--music);
    border: 1px solid rgba(96,224,192,0.2);
  }

  .folder-STORY_1, .folder-STORY_2, .folder-STORY_3,
  .folder-STORY_4, .folder-STORY_5, .folder-STORY_6, .folder-STORY_7 {
    background: rgba(255,159,122,0.1);
    color: var(--story);
    border: 1px solid rgba(255,159,122,0.2);
  }

  .folder-UNIQUE_1, .folder-UNIQUE_2, .folder-UNIQUE_3 {
    background: rgba(192,122,255,0.1);
    color: var(--special);
    border: 1px solid rgba(192,122,255,0.2);
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .copy-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .copy-btn.copied { border-color: var(--music); color: var(--music); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 64px 20px;
    color: var(--muted);
  }

  .empty-icon { font-size: 3rem; margin-bottom: 16px; }
  .empty p { font-size: 15px; }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding-bottom: 48px;
    flex-wrap: wrap;
  }

  .page-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .page-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-btn.current { background: rgba(124,107,255,0.2); border-color: var(--accent2); color: var(--accent2); }

  .page-info {
    font-size: 13px;
    color: var(--muted);
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }
</style>
</head>

// State
let state = { query: '', category: 'All', folder: '', page: 1 };
const PER_PAGE = 50;

// Init
(function init() {
  const counts = { Music: 0, Story: 0, Special: 0 };
  const folders = new Set();
  FILES.forEach(f => { counts[f.category]++; folders.add(f.folder); });
  document.getElementById('stat-music').textContent = counts.Music;
  document.getElementById('stat-story').textContent = counts.Story;
  document.getElementById('stat-special').textContent = counts.Special;

  const sel = document.getElementById('folderSelect');
  [...folders].sort().forEach(f => {
    const o = document.createElement('option');
    o.value = f; o.textContent = f;
    sel.appendChild(o);
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    state.query = e.target.value; state.page = 1; render();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.category = btn.dataset.cat; state.page = 1;
      document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn');
      btn.classList.add('active-' + state.category.toLowerCase());
      render();
    });
  });

  sel.addEventListener('change', e => { state.folder = e.target.value; state.page = 1; render(); });
  render();
})();

function highlight(text, query) {
  if (!query) return escHtml(text);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filter() {
  const q = state.query.trim().toLowerCase();
  return FILES.filter(f => {
    if (state.category !== 'All' && f.category !== state.category) return false;
    if (state.folder && f.folder !== state.folder) return false;
    if (q) {
      return f.name.toLowerCase().includes(q) ||
             f.folder.toLowerCase().includes(q) ||
             f.filename.toLowerCase().includes(q);
    }
    return true;
  });
}

function render() {
  const filtered = filter();
  const total = filtered.length;
  const pages = Math.ceil(total / PER_PAGE);
  const start = (state.page - 1) * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);

  const q = state.query.trim();
  document.getElementById('resultsInfo').innerHTML =
    `Showing <span>${slice.length}</span> of <span>${total}</span> files` +
    (q ? ` matching "<span>${escHtml(q)}</span>"` : '');

  const list = document.getElementById('fileList');
  if (!slice.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>No files found. Try a different search.</p></div>`;
  } else {
    list.innerHTML = slice.map(f => `
      <div class="file-item">
        <span class="cat-dot ${f.category}" title="${f.category}"></span>
        <span class="file-name" title="${escHtml(f.path)}">${highlight(f.name, q)}</span>
        <span class="file-folder folder-${f.folder}">${f.folder}</span>
        <button class="copy-btn" onclick="copyPath(this,'${escHtml(f.path).replace(/'/g,"\\'")}')">Copy path</button>
      </div>`).join('');
  }

  renderPagination(pages);
}

function renderPagination(pages) {
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="goPage(${state.page-1})" ${state.page===1?'disabled':''}>← Prev</button>`;
  const range = [];
  for (let i = 1; i <= pages; i++) {
    if (i===1||i===pages||Math.abs(i-state.page)<=2) range.push(i);
    else if (range[range.length-1]!=='…') range.push('…');
  }
  range.forEach(p => {
    if (p==='…') html += `<span class="page-info">…</span>`;
    else html += `<button class="page-btn ${p===state.page?'current':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html += `<button class="page-btn" onclick="goPage(${state.page+1})" ${state.page===pages?'disabled':''}>Next →</button>`;
  el.innerHTML = html;
}

function goPage(p) { state.page = p; window.scrollTo(0,0); render(); }

function copyPath(btn, path) {
  navigator.clipboard.writeText(path).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy path'; btn.classList.remove('copied'); }, 1500);
  });
}
